[project]
name = "tftmac-pipeline"
version = "0.2.0"
description = "TFT Mac Companion data pipeline — Riot Match-v5 API → tier-list.json"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "aiolimiter>=1.1",
  "boto3>=1.34",
]

[project.scripts]
tft-aggregate = "tftmac_pipeline.run_aggregator:main_sync"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
