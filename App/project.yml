name: TFTMac
options:
  bundleIdPrefix: asia.lab3.tftmac
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    ARCHS: $(ARCHS_STANDARD)
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  HotKey:
    url: https://github.com/soffes/HotKey.git
    from: "0.2.0"

targets:
  TFTMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TFTMac
        excludes:
          - "**/.gitkeep"
    resources:
      - path: TFTMac/Assets.xcassets
      - path: TFTMac/Resources/sample-tier-list.json
    info:
      path: TFTMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: TFT Mac
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: TFTMac/Resources/TFTMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.lab3.tftmac
        PRODUCT_NAME: TFTMac
        CODE_SIGN_ENTITLEMENTS: TFTMac/Resources/TFTMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: HotKey

  TFTMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TFTMacTests
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.lab3.tftmac.tests
        GENERATE_INFOPLIST_FILE: YES
        # TODO(Phase 3 CI): when wiring GitHub Actions, pass
        # CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO on xcodebuild cmd line,
        # or add a CI xcconfig overlay. Ad-hoc "-" identity works locally per
        # docs/pre-spike-xcuitest-menubar.md but breaks on CI runners.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TFTMac.app/Contents/MacOS/TFTMac"
    dependencies:
      - target: TFTMac

  TFTMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TFTMacUITests
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.lab3.tftmac.uitests
        GENERATE_INFOPLIST_FILE: YES
        # TODO(Phase 3 CI): when wiring GitHub Actions, pass
        # CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO on xcodebuild cmd line,
        # or add a CI xcconfig overlay. Ad-hoc "-" identity works locally per
        # docs/pre-spike-xcuitest-menubar.md but breaks on CI runners.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: TFTMac
    dependencies:
      - target: TFTMac

schemes:
  TFTMac:
    build:
      targets:
        TFTMac: all
        TFTMacTests: [test]
        TFTMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TFTMacTests
        - TFTMacUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
